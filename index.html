<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Anzan Trainer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: monospace;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: #111;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content { flex: 1; }
        input, button, select {
            font-family: inherit;
            font-size: 16px;
            padding: 8px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
        }
        button { width: 100%; margin: 5px 0; }
        .row { display: flex; align-items: center; margin: 5px 0; }
        .row span { min-width: 110px; }
        .row input, .row select { flex: 1; margin: 0; }
        #display {
            font-size: 72px;
            text-align: center;
            min-height: 90px;
            margin: 40px 0;
        }
        #breakdown {
            margin: 20px 0;
            padding: 15px;
            background: #222;
            white-space: pre-line;
        }
        .hidden { display: none; }
        .correct { color: #4f4; }
        .incorrect { color: #f44; }
        h1 { text-align: center; margin: 20px 0 5px; }
        h2 { text-align: center; margin: 0 0 30px; color: #888; font-weight: normal; font-size: 16px; }
        footer {
            margin-top: auto;
            padding: 24px 0;
            border-top: 1px solid #333;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        footer p { margin: 0 0 8px; }
        footer a { text-decoration: none; }
    </style>
</head>
<body>
    <div class="main-content">
        <!-- SETUP -->
        <div id="setup">
            <h1>Flash Anzan Trainer</h1>
            <h2 id="subtitle">Add them all up!</h2>
            <div class="row"><span>Mode:</span><select id="mode"><option value="add">Add</option><option value="subtract">Subtract</option><option value="both">Both</option></select></div>
            <div class="row"><span>Start from:</span><input type="number" id="startFrom" value="0"></div>
            <div class="row"><span>Count:</span><input type="number" id="count" value="10" min="1" max="20"></div>
            <div class="row"><span>Digits:</span><input type="number" id="digits" value="1" min="1" max="6"></div>
            <div class="row"><span>Interval (s):</span><input type="number" id="interval" value="1" min="0.5" max="10" step="0.1"></div>
            <button onclick="startSession()">Start</button>
        </div>

        <!-- SESSION -->
        <div id="session" class="hidden"><div id="display"></div></div>

        <!-- ANSWER -->
        <div id="answer" class="hidden">
            <div>Your answer: <input type="number" id="userAnswer"></div>
            <button onclick="checkAnswer()">Check</button>
        </div>

        <!-- RESULTS -->
        <div id="results" class="hidden">
            <div id="breakdown"></div>
            <button onclick="replay()">Replay</button>
            <button onclick="reset()">New Session</button>
        </div>
    </div>

    <footer>
        <p style="color:#aaa">Built by <a href="https://kevinyuwenwang.github.io" style="color:#4a9eff">Kevin Y. Wang</a></p>
        <p style="font-size:12px">
            <a href="https://github.com/kevinyuwenwang/flash-anzan" style="color:#666">Source</a>&nbsp;&nbsp;·&nbsp;&nbsp;
            <a href="mailto:kevin.yuwen.wang@gmail.com" style="color:#666">Contact</a>
        </p>
        <p style="font-size:12px;color:#9ca3af">&copy; 2026 Kevin Y. Wang</p>
    </footer>

    <script>
        const FLASH = 50;
        const SUBTITLES = { add: 'Add them all up!', subtract: 'Subtract them all!', both: 'Mix and match!' };
        const $ = id => document.getElementById(id);

        let settings = null;
        let idx = 0;
        let timer;

        // --- generation ---
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const genNum = d => rand(10 ** (d - 1), 10 ** d - 1);
        const genOp  = mode =>
            mode === 'add' ? '+' :
            mode === 'subtract' ? '-' :
            Math.random() < 0.5 ? '+' : '-';

        function build() {
            const nums = Array.from({ length: settings.count }, () => genNum(settings.digits));
            const ops  = nums.map(() => genOp(settings.mode));
            const items = [String(settings.start)];
            let total = settings.start;
            for (let i = 0; i < nums.length; i++) {
                items.push(ops[i] + nums[i]);
                total += ops[i] === '+' ? nums[i] : -nums[i];
            }
            settings.items = items;
            settings.correct = total;
            settings.expression = items.join(' ');
        }

        // --- UI helpers ---
        function show(id) {
            ['setup', 'session', 'answer', 'results'].forEach(el => $(el).classList.add('hidden'));
            $(id).classList.remove('hidden');
        }

        function clearTimer() { clearTimeout(timer); }

        // --- phases ---
        function startSession() {
            clearTimer();
            settings = {
                mode:     $('mode').value,
                start:    parseInt($('startFrom').value) || 0,
                count:    parseInt($('count').value)     || 10,
                digits:   parseInt($('digits').value)    || 1,
                interval: (parseFloat($('interval').value) || 1) * 1000
            };
            build();
            $('subtitle').textContent = SUBTITLES[settings.mode];
            show('session');
            countdown();
        }

        function countdown() {
            const d = $('display');
            d.style.fontSize = '48px';
            let c = 3;
            d.textContent = 'Countdown: ' + c;
            const t = setInterval(() => {
                c--;
                if (c > 0) { d.textContent = 'Countdown: ' + c; }
                else {
                    clearInterval(t);
                    d.style.fontSize = '72px';
                    idx = 0;
                    flash();
                }
            }, 1000);
        }

        function flash() {
            if (idx >= settings.items.length) { showAnswer(); return; }
            const d = $('display');
            d.textContent = '';
            setTimeout(() => {
                d.textContent = settings.items[idx];
                idx++;
                if (idx < settings.items.length) {
                    timer = setTimeout(flash, settings.interval);
                } else {
                    timer = setTimeout(showAnswer, settings.interval);
                }
            }, FLASH);
        }

        function showAnswer() {
            show('answer');
            const input = $('userAnswer');
            input.value = '';
            input.focus();
        }

        function checkAnswer() {
            const user = parseInt($('userAnswer').value);
            const ok = user === settings.correct;
            const el = $('breakdown');
            el.textContent =
                settings.expression + ' = ' + settings.correct +
                '\nYour answer: ' + user +
                '\n' + (ok ? '✓ Correct!' : '✗ Incorrect');
            el.className = ok ? 'correct' : 'incorrect';
            show('results');
        }

        function replay() {
            build();
            show('session');
            countdown();
        }

        function reset() {
            clearTimer();
            show('setup');
        }

        // --- events ---
        $('mode').addEventListener('change', e => { $('subtitle').textContent = SUBTITLES[e.target.value]; });
        $('userAnswer').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
    </script>
</body>
</html>
